aid: arundo-analytics
name: Arundo Analytics
description: 'Arundo Analytics is an industrial AI company with offices in Oslo, Stockholm,
  Heidelberg and Houston, building software for asset-heavy industries such as oil
  and gas, maritime and shipping, chemicals and manufacturing. Its Arundo AI Foundation
  platform combines a knowledge graph of asset hierarchies and sensor metadata, industrial
  time-series storage built for high-velocity sensor data, parallelised machine-learning
  model orchestration, and specialised AI agents, surfaced through the AI Foundation
  Studio and what the company calls the Arundo Foundation APIs. Packaged applications
  include Marathon (continuous equipment condition monitoring), ArundoEdge and Edge
  Manager (secure streaming of IoT sensor data from control systems to the cloud),
  Energy Optimizer, CarbonPath (Scope 3 emissions management for shipping) and AI
  Companion. Arundo also maintains the open-source Python packages ADTK (unsupervised
  time-series anomaly detection) and tsaug (time-series augmentation), and publishes
  a public Foundation compute plug-in contract on GitHub. The Foundation APIs themselves
  are marketed on the public site but are not publicly documented; there is no developer
  portal, no public API reference and no machine-readable specification, and the applications
  sit behind an Auth0 customer login.'
